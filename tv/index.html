<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171614" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Dino TV</title>
    <link rel="icon" type="image/png" href="/assets/dino-icon-512.png" />
    <link rel="stylesheet" href="./tv.css" />
  </head>
  <body data-theme="gallery">
    <div id="sceneBackdrop" aria-hidden="true"></div>
    <div id="photo"></div>
    <div id="wash"></div>
    <div id="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div id="sceneDecor" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div id="grain" aria-hidden="true"></div>
    <div id="stage">
      <header id="top">
        <nav id="modes" aria-label="Экран">
          <button data-mode="TODAY">Сегодня</button>
          <button data-mode="TOMORROW">Завтра</button>
          <button data-mode="WEEK">Неделя</button>
        </nav>
      </header>
      <section id="hero">
        <time id="clock">00:00</time>
        <div class="hero-copy">
          <p id="dateLine">Санкт-Петербург</p>
          <p id="weatherLine"></p>
        </div>
      </section>
      <p id="note" hidden></p>
      <main id="screen"></main>
    </div>
    <aside id="mediaBar" hidden aria-label="Сейчас играет">
      <div class="media-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="media-copy">
        <strong id="mediaTitle"></strong>
        <span id="mediaArtist"></span>
        <em id="mediaSource"></em>
      </div>
    </aside>
    <section id="pair" hidden>
      <p class="eyebrow" id="pairEyebrow">Подключение экрана</p>
      <h1 id="pairTitle">Откройте Dino TV в телефоне и введите код</h1>
      <p id="pairCode">••••••</p>
      <small id="pairNote">Код живёт десять минут. После этого телевизор запомнит дом сам.</small>
    </section>
    <aside id="eventCue" hidden>
      <p class="eyebrow" id="eventCueWhen">Через 5 минут</p>
      <strong id="eventCueTitle">Дело</strong>
      <span id="eventCueMeta"></span>
    </aside>
    <script type="module" src="./tv.js"></script>
  </body>
</html>
