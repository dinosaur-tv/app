name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build a portable exe
        working-directory: desktop
        # No code-signing certificate: without this electron-builder tries to sign and fails.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build
      - name: Name the artefact after the tag
        shell: bash
        working-directory: desktop
        run: |
          # A tag names the build; a manual run falls back to the version in package.json.
          version="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) version=$(node -p "require('./package.json').version")-dev ;; esac
          built=$(ls dist/*.exe | head -1)
          mkdir -p out
          cp "$built" "out/dino-tv-desktop-${version:-dev}.exe"
          cd out && sha256sum *.exe > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dino-tv-desktop
          path: desktop/out/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Dino TV на мониторе компьютера. Portable — просто запустите .exe." desktop/out/* || gh release upload "$GITHUB_REF_NAME" desktop/out/* --clobber
