repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: miniapp-quality
        name: Mini App quality
        entry: npm run quality
        language: system
        pass_filenames: false
        files: '^(.*\.js|package(-lock)?\.json|eslint\.config\.mjs)$'
