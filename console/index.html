<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171614" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/assets/dino-icon-512.png" />
    <link rel="apple-touch-icon" href="/assets/dino-icon-512.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Dino TV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="remote">
      <header>
        <strong>Dino TV</strong>
      </header>

      <section id="pane-screen" class="pane">
        <div class="modes" role="group" aria-label="Экран">
          <button data-mode="NOW">Сейчас</button>
          <button data-mode="TODAY">Сегодня</button>
          <button data-mode="WEEK">Неделя</button>
        </div>

        <div class="themes" role="group" aria-label="Сцена">
          <button class="gallery" data-scene="gallery"><i></i><span>Галерея</span></button>
          <button class="night" data-scene="night"><i></i><span>Ночь</span></button>
          <button class="play" data-scene="play"><i></i><span>Шалость</span></button>
          <button class="forest" data-scene="forest"><i></i><span>Лес</span></button>
          <button class="mountains" data-scene="mountains"><i></i><span>Горы</span></button>
          <button class="sea" data-scene="sea"><i></i><span>Море</span></button>
          <button class="space" data-scene="space"><i></i><span>Космос</span></button>
        </div>

        <div class="guests" role="group" aria-label="Гости">
          <button type="button" data-privacy="false">Нет гостей</button>
          <button type="button" data-privacy="true">Гости</button>
        </div>

        <div class="note-block">
          <button type="button" class="action" id="addNote">Добавить</button>
          <div id="noteCard" class="note-card" hidden>
            <p id="notePreview"></p>
            <button type="button" class="action" id="clearNote">Снять</button>
          </div>
        </div>

        <div class="wallpaper">
          <label class="upload">
            <input id="background" type="file" accept="image/*" />
            <span id="wallpaperLabel">Поставить обои</span>
          </label>
          <span id="backgroundPreview" hidden></span>
          <button type="button" class="ghost" id="clearBackground">Сброс</button>
        </div>
      </section>

      <section id="pane-music" class="pane" hidden>
        <div class="now-playing">
          <div id="musicArt" class="art" aria-hidden="true"></div>
          <strong id="musicTitle">Тихо</strong>
          <span id="musicArtist">Яндекс Музыка</span>
        </div>
        <div class="transport" role="group" aria-label="Плеер">
          <button type="button" data-music="previous" aria-label="Предыдущий">⏮</button>
          <button type="button" class="primary" data-music="toggle" id="musicToggle" aria-label="Играть">▶</button>
          <button type="button" data-music="next" aria-label="Следующий">⏭</button>
        </div>
        <label class="volume">
          <span>Громкость</span>
          <input id="musicVolume" type="range" min="0" max="100" value="50" />
        </label>
        <button type="button" class="action" data-music="toTv">На телевизор</button>
        <p class="hint" id="musicHint">Откройте Кинопоиск на ТВ и войдите в тот же Яндекс. Тогда звук пойдёт с гостиной, а пульт будет им управлять.</p>
      </section>

      <section id="pane-more" class="pane" hidden>
        <p class="hint">Если телевизор забыл дом, введите код с экрана.</p>
        <form id="pairForm" class="compose">
          <input id="pairCode" inputmode="numeric" maxlength="6" placeholder="Код ТВ" autocomplete="one-time-code" />
          <button type="submit">Связать</button>
        </form>
        <button type="button" class="action" id="reloadTv">Залить обновления</button>
        <p class="people" id="calendarWarning" hidden></p>
      </section>

      <p class="status" id="notice" role="status"></p>
    </main>

    <div id="noteSheet" class="sheet-root" hidden>
      <button type="button" class="sheet-backdrop" id="noteSheetClose" aria-label="Закрыть"></button>
      <form id="noteForm" class="sheet">
        <strong>Заметка</strong>
        <textarea id="note" maxlength="180" rows="3" placeholder="Что написать на экране"></textarea>
        <div id="noteDurations" class="durations" role="group" aria-label="Сколько держать"></div>
        <button type="submit">Поставить</button>
      </form>
    </div>

    <nav class="dock" role="tablist" aria-label="Разделы">
      <button type="button" data-tab="screen" class="active">Экран</button>
      <button type="button" data-tab="music">Музыка</button>
      <button type="button" data-tab="more">Ещё</button>
    </nav>
    <script type="module" src="./app.js"></script>
  </body>
</html>
