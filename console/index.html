<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171614" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/assets/dino-icon-512.png" />
    <link rel="apple-touch-icon" href="/assets/dino-icon-512.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Dino TV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="remote">
      <header>
        <strong>Dino TV</strong>
        <button type="button" id="settingsBtn" class="icon" aria-label="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.22-1.14.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.4.31.64.22l2.39-.96c.49.4 1.04.72 1.63.94l.36 2.54c.05.24.26.42.5.42h3.84c.24 0 .45-.18.5-.42l.36-2.54c.59-.22 1.14-.53 1.63-.94l2.39.96c.24.1.51 0 .64-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z"/></svg>
        </button>
      </header>

      <div class="modes" role="group" aria-label="Экран">
        <button data-mode="NOW">Сейчас</button>
        <button data-mode="TODAY">Сегодня</button>
        <button data-mode="WEEK">Неделя</button>
      </div>

      <div class="moods" role="group" aria-label="Режим">
        <button data-mood="home">Дом</button>
        <button data-mood="night">Ночь</button>
        <button data-mood="play">Шалость</button>
      </div>

      <div class="themes" role="group" aria-label="Тема">
        <button class="gallery" data-theme="gallery" aria-label="Галерея"></button>
        <button class="tobacco" data-theme="tobacco" aria-label="Табак"></button>
        <button class="taupe" data-theme="taupe" aria-label="Тауп"></button>
        <button class="stone" data-theme="stone" aria-label="Камень"></button>
        <button class="forest" data-theme="forest" aria-label="Лес"></button>
        <button class="apple" data-theme="apple" aria-label="Светлый"></button>
      </div>

      <div class="guests" role="group" aria-label="Гости">
        <button type="button" data-privacy="false">Нет гостей</button>
        <button type="button" data-privacy="true">Гости</button>
      </div>

      <form id="noteForm" class="compose">
        <input id="note" maxlength="180" placeholder="Заметка на час" />
        <button type="submit">Ок</button>
        <button type="button" id="clearNote" class="ghost">Снять</button>
      </form>

      <div class="wallpaper">
        <label class="upload">
          <input id="background" type="file" accept="image/*" />
          <span id="wallpaperLabel">Поставить обои</span>
        </label>
        <span id="backgroundPreview" hidden></span>
        <button type="button" class="ghost" id="clearBackground">Сброс</button>
      </div>

      <button type="button" class="action" id="reloadTv">Залить обновления</button>

      <p class="people" id="calendarWarning" hidden></p>
      <p class="status" id="notice" role="status"></p>
    </main>

    <section id="settings" hidden>
      <div class="sheet">
        <header>
          <strong>Экран</strong>
          <button type="button" id="closeSettings" class="ghost">Закрыть</button>
        </header>
        <p class="hint">Если телевизор забыл дом, введите код с экрана.</p>
        <form id="pairForm" class="compose">
          <input id="pairCode" inputmode="numeric" maxlength="6" placeholder="Код ТВ" autocomplete="one-time-code" />
          <button type="submit">Связать</button>
        </form>
      </div>
    </section>
    <script type="module" src="./app.js"></script>
  </body>
</html>
