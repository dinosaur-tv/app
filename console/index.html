<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#171614" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/png" href="/assets/dino-icon-512.png" />
    <link rel="apple-touch-icon" href="/assets/dino-icon-512.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Dino TV</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="remote">
      <header>
        <strong>Dino TV</strong>
        <span id="connectionState">…</span>
      </header>

      <div class="modes" role="group" aria-label="Экран">
        <button data-mode="NOW">Сейчас</button>
        <button data-mode="TODAY">Сегодня</button>
        <button data-mode="WEEK">Неделя</button>
      </div>

      <div class="themes" role="group" aria-label="Тема">
        <button class="gallery" data-theme="gallery" aria-label="Галерея"></button>
        <button class="tobacco" data-theme="tobacco" aria-label="Табак"></button>
        <button class="taupe" data-theme="taupe" aria-label="Тауп"></button>
        <button class="stone" data-theme="stone" aria-label="Камень"></button>
        <button class="forest" data-theme="forest" aria-label="Лес"></button>
        <button class="apple" data-theme="apple" aria-label="Светлый"></button>
      </div>

      <label class="row">
        <span>Гости</span>
        <button class="switch" id="privacySwitch" type="button" aria-label="Гостевой режим" aria-pressed="false"><i></i></button>
      </label>

      <form id="noteForm" class="note">
        <input id="note" maxlength="180" placeholder="Заметка на час" />
        <button type="submit">Ок</button>
        <button type="button" id="clearNote" class="ghost">Снять</button>
      </form>

      <div class="row files">
        <label class="ghost">
          Фон
          <input id="background" type="file" accept="image/jpeg,image/png,image/webp" />
        </label>
        <span id="backgroundPreview" hidden></span>
        <button type="button" class="ghost" id="clearBackground">Сброс</button>
      </div>

      <form id="pairForm" class="note">
        <input id="pairCode" inputmode="numeric" maxlength="6" placeholder="Код ТВ" autocomplete="one-time-code" />
        <button type="submit">Связать</button>
      </form>

      <p class="people">
        <i class="misha"></i> Миша <small id="mishaStatus"></small>
        <i class="natasha"></i> Наташа <small id="natashaStatus"></small>
      </p>
      <p class="status" id="notice" role="status"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
